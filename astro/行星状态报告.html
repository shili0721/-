<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>本命盘 · 行星状态报告</title>
<style>
  :root{
    --bg:#0f1120; --card:#1c2038; --card2:#171a30; --ink:#e8eaf6;
    --muted:#a6accd; --gold:#e6c37a; --gold2:#f0d9a6; --line:#2c3252;
    --accent:#8f7bff; --accent2:#5ec2c9; --good:#7ee0a0; --bad:#ff8a8a; --warn:#ffcf7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:radial-gradient(1200px 700px at 20% -10%, #23264a 0%, var(--bg) 55%) fixed;
    color:var(--ink); font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    line-height:1.8; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:40px 22px 90px;}
  header.hero{text-align:center; padding:36px 20px 30px; border-radius:22px;
    background:linear-gradient(160deg,#20233f,#161930); border:1px solid var(--line); position:relative; overflow:hidden;}
  header.hero:before{content:""; position:absolute; inset:0;
    background:radial-gradient(500px 200px at 50% 0%, rgba(143,123,255,.18), transparent 70%);}
  .hero .sub{color:var(--gold); letter-spacing:.32em; font-size:12px; margin:0 0 12px;}
  .hero h1{margin:0; font-size:30px; font-weight:700; letter-spacing:.04em;}
  .hero h1 span{color:var(--gold2);}
  .hero p.desc{color:var(--muted); font-size:14px; margin:14px auto 0; max-width:640px;}

  .layout{display:grid; grid-template-columns:340px 1fr; gap:22px; margin-top:26px; align-items:start;}
  @media(max-width:880px){.layout{grid-template-columns:1fr;}}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 22px;}
  .card h2{font-size:17px; margin:0 0 16px; padding-left:12px; position:relative; letter-spacing:.02em;}
  .card h2:before{content:""; position:absolute; left:0; top:4px; bottom:4px; width:5px; border-radius:4px;
    background:linear-gradient(var(--gold),var(--accent));}
  label{display:block; font-size:12px; color:var(--muted); margin:12px 0 5px;}
  input,select{width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--ink); font-size:14px; outline:none;}
  input:focus,select:focus{border-color:var(--accent);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr .8fr; gap:10px;}
  button{width:100%; margin-top:16px; padding:12px; border:none; border-radius:12px; cursor:pointer;
    font-size:15px; font-weight:600; letter-spacing:.05em;
    background:linear-gradient(120deg,var(--gold),var(--accent)); color:#0f1120;}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--muted); font-weight:500; margin-top:9px;}
  button:hover{filter:brightness(1.08);}

  .placeholder{color:var(--muted); text-align:center; padding:70px 20px; font-size:14px;}
  .sumgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;}
  @media(max-width:640px){.sumgrid{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .stat .k{font-size:11px; color:var(--muted); letter-spacing:.05em;}
  .stat .v{font-size:16px; font-weight:600; color:var(--gold2); margin-top:3px;}

  .block{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-top:14px;}
  .block h3{margin:0 0 10px; font-size:15px; color:var(--accent2);}
  .rowline{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13.5px;}
  .rowline b{color:var(--ink);}

  .pcards{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:12px;}
  @media(max-width:640px){.pcards{grid-template-columns:1fr;}}
  .pcard{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:14px 16px; position:relative;}
  .pcard .head{display:flex; align-items:baseline; gap:8px;}
  .pcard .glyph{font-size:22px; color:var(--gold);}
  .pcard .nm{font-size:16px; font-weight:600;}
  .pcard .pos{margin-left:auto; font-size:13px; color:var(--muted);}
  .pcard .house{display:inline-block; margin-top:6px; font-size:12.5px; color:var(--accent2);}
  .tags{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;}
  .tag{font-size:11.5px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:#12142a; color:var(--muted);}
  .tag.dig{color:var(--good); border-color:rgba(126,224,160,.35); background:rgba(126,224,160,.08);}
  .tag.deb{color:var(--bad); border-color:rgba(255,138,138,.35); background:rgba(255,138,138,.08);}
  .tag.retro{color:var(--warn); border-color:rgba(255,207,122,.35); background:rgba(255,207,122,.08);}
  .tag.crit{color:#ff9edb; border-color:rgba(255,158,219,.35); background:rgba(255,158,219,.08);}
  .tag.sect{color:var(--accent); border-color:rgba(143,123,255,.4); background:rgba(143,123,255,.1);}
  .tag.recep{color:var(--accent2); border-color:rgba(94,194,201,.4); background:rgba(94,194,201,.1);}
  .pcard .note{margin-top:8px; font-size:12.5px; color:var(--muted); line-height:1.6;}
  .ruler-badge{position:absolute; top:12px; right:12px; font-size:10.5px; color:#0f1120;
    background:linear-gradient(120deg,var(--gold),var(--gold2)); padding:2px 8px; border-radius:999px; font-weight:700;}

  ul.recl{margin:8px 0 0; padding-left:20px;} ul.recl li{margin:5px 0; font-size:13.5px; color:#d7dbf2;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .err{color:var(--bad); font-size:13px; margin-top:10px;}
  .small{font-size:11.5px; color:var(--muted);}
  footer{margin-top:30px; text-align:center; color:var(--muted); font-size:12.5px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <p class="sub">N A T A L　P L A N E T　S T A T U S</p>
    <h1>本命盘 · <span>行星状态报告</span></h1>
    <p class="desc">输入出生信息，自动生成十大行星的<b>落座 · 度数 · 宫位 · 逆行 · 尊贵状态 · 昼夜得时 · 临界度数 · 互容接纳</b>，以及四轴与命主星。维度对齐职业分析报告所用的行星内容。</p>
  </header>

  <div class="layout">
    <!-- 输入 -->
    <div class="card">
      <h2>出生信息</h2>
      <label>姓名</label>
      <input id="name" placeholder="选填" />
      <div class="row3">
        <div><label>出生日期</label><input id="date" type="date" /></div>
        <div><label>时间</label><input id="time" type="time" step="60" /></div>
        <div><label>时区 GMT±</label><input id="tz" type="number" step="0.5" value="8" /></div>
      </div>
      <label>地点名称</label>
      <input id="place" placeholder="选填，如 东营市" />
      <div class="row2">
        <div><label>经度（东+ / 西−）</label><input id="lon" type="number" step="0.0001" placeholder="118.65" /></div>
        <div><label>纬度（北+ / 南−）</label><input id="lat" type="number" step="0.0001" placeholder="37.4167" /></div>
      </div>
      <label>分宫制</label>
      <select id="house">
        <option value="Alcabitius">阿卡比特制（Alcabitius）· 宫神星默认</option>
        <option value="Placidus">普拉西德制（Placidus）</option>
      </select>
      <button id="btnGen">生成行星状态报告</button>
      <button id="btnSample" class="ghost">载入样例（王昭幻 2006-07-21 23:00 东营）</button>
      <div class="err" id="err"></div>
      <div class="small" style="margin-top:12px">采用回归黄道 + 精确星历，全程本地计算，不上传任何数据。</div>
    </div>

    <!-- 结果 -->
    <div class="card" id="out">
      <div class="placeholder" id="ph">← 在左侧填写或载入样例，然后点击「生成行星状态报告」。</div>
      <div id="result" style="display:none"></div>
    </div>
  </div>

  <footer>行星状态报告 · 回归黄道 / 阿卡比特制 · 与宫神星排盘系统一致</footer>
</div>

<script src="js/astronomy.browser.js"></script>
<script src="js/astro-engine.js"></script>
<script src="js/planet-report.js"></script>
</body>
</html>
