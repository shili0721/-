<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星盘识别 Demo · 本命盘解析</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header>
    <h1>✦ 星盘识别 Demo</h1>
    <p>上传星盘截图 → 识别出生信息 → 用精确星历重算行星 / 四轴 / 托勒密相位 / 特能（行星尊贵）</p>
  </header>

  <div class="container">
    <!-- 左侧：输入 -->
    <div>
      <div class="card">
        <h2>① 上传星盘图片 <span class="tag">AI 识别出生信息</span></h2>
        <div class="drop" id="drop">
          <div id="dropHint">点击或拖拽星盘截图到此处<br /><span class="small">识别图片左上角的出生信息</span></div>
          <img id="preview" style="display:none" alt="preview" />
        </div>
        <input type="file" id="file" accept="image/*" style="display:none" />
        <button id="btnRecognize" class="secondary">识别图片并生成</button>
        <div class="status" id="visionStatus"></div>

        <details class="adv">
          <summary>视觉接口设置（OpenAI 兼容，可选）</summary>
          <label>Base URL</label>
          <input id="apiBase" placeholder="https://api.openai.com/v1" />
          <label>API Key</label>
          <input id="apiKey" type="password" placeholder="sk-..." />
          <label>模型（需支持视觉）</label>
          <input id="apiModel" placeholder="gpt-4o / qwen-vl-max / glm-4v ..." />
          <div class="small" style="margin-top:6px">未配置时可直接用下方手动输入。设置仅保存在本地浏览器。</div>
        </details>
      </div>

      <div class="card">
        <div class="divider">或 手动输入出生信息</div>
        <h2>② 出生信息</h2>
        <label>姓名</label>
        <input id="name" />
        <div class="row3">
          <div><label>出生日期</label><input id="date" type="date" /></div>
          <div><label>时间</label><input id="time" type="time" step="1" /></div>
          <div><label>时区 GMT±</label><input id="tz" type="number" step="0.5" /></div>
        </div>
        <label>地点名称</label>
        <input id="place" />
        <div class="row2">
          <div><label>经度（东+ / 西−，十进制）</label><input id="lon" type="number" step="0.0001" /></div>
          <div><label>纬度（北+ / 南−，十进制）</label><input id="lat" type="number" step="0.0001" /></div>
        </div>
        <label>分宫制</label>
        <select id="houseSystem">
          <option value="Placidus">Placidus（普拉西德制）</option>
        </select>
        <button id="btnCompute">生成星盘解析</button>
        <button id="btnSample" class="secondary" style="margin-top:8px">载入样例（刘☆秀 2005-08-06）</button>
      </div>
    </div>

    <!-- 右侧：结果 -->
    <div>
      <div class="card">
        <div class="tabs">
          <div class="tab active" data-tab="report">📋 文本报告</div>
          <div class="tab" data-tab="tables">📊 数据表</div>
          <div class="tab" data-tab="wheel">🌀 星盘图</div>
        </div>

        <div class="tabpage active" id="page-report">
          <div class="toolbar">
            <h2>解析结果</h2>
            <button class="secondary copybtn" id="btnCopy">复制文本</button>
          </div>
          <pre class="report" id="report">在左侧上传星盘图片或手动输入出生信息，然后点击生成。

也可点击「载入样例」直接体验。</pre>
        </div>

        <div class="tabpage" id="page-tables">
          <div id="tables"></div>
        </div>

        <div class="tabpage" id="page-wheel">
          <div class="chart-wrap"><canvas id="wheel" width="560" height="560"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/astronomy.browser.js"></script>
  <script src="js/astro-engine.js"></script>
  <script src="js/report.js"></script>
  <script src="js/vision.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
