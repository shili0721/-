const CUSTOM_LEVEL_KEY = 'screw_custom_level';          // 兼容旧单关卡存储
const CUSTOM_LEVELS_KEY = 'screw_custom_levels_v1';     // 新：自定义关卡库

function loadCustomLevels(){
  try {
    const raw = localStorage.getItem(CUSTOM_LEVELS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}
function saveCustomLevels(list){
  try { localStorage.setItem(CUSTOM_LEVELS_KEY, JSON.stringify(list)); } catch(e){}
}
function loadLegacyCustomData(){
  try { const raw = localStorage.getItem(CUSTOM_LEVEL_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function getCustomEntryById(id){ return loadCustomLevels().find(x => x.id === id) || null; }

function loadCustomData(customId = null){
  const list = loadCustomLevels().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if (customId) {
    const byId = list.find(x => x.id === customId);
    if (byId && byId.data) return byId.data;
  }
  if (list.length && list[0].data) return list[0].data;   // 默认取最近更新
  return loadLegacyCustomData();                            // 兜底兼容旧数据
}

function fmtCustomTime(ts){
  const d = new Date(ts || Date.now());
  const p = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderCustomLibrary(){
  const box = document.getElementById('custom-lib-list');
  if (!box) return;
  const list = loadCustomLevels();
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div style="color:#9fb0d2;font-size:12px;padding:6px 2px;">暂无，去雕塑编辑器点「快速保存」即可加入</div>';
    return;
  }
  list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).forEach(item => {
    const row = document.createElement('div');
    row.className = 'custom-lib-item';

    const left = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'custom-lib-name';
    name.textContent = item.name || '未命名关卡';
    const time = document.createElement('div');
    time.className = 'custom-lib-time';
    time.textContent = `更新于 ${fmtCustomTime(item.updatedAt)}`;
    left.append(name, time);

    const ops = document.createElement('div');
    ops.className = 'custom-lib-ops';

    const bPlay = document.createElement('button');
    bPlay.className = 'custom-op play';
    bPlay.textContent = '试玩';
    bPlay.addEventListener('click', () => enterLevel('custom', item.id));

    const bEdit = document.createElement('button');
    bEdit.className = 'custom-op edit';
    bEdit.textContent = '编辑';
    bEdit.addEventListener('click', () => {
      location.href = `sculpt.html?edit=${encodeURIComponent(item.id)}`;
    });

    const bDel = document.createElement('button');
    bDel.className = 'custom-op del';
    bDel.textContent = '删除';
    bDel.addEventListener('click', () => {
      if (!confirm(`删除自定义关卡「${item.name || '未命名关卡'}」？`)) return;
      const next = loadCustomLevels().filter(x => x.id !== item.id);
      saveCustomLevels(next);
      if (next.length && next[0].data) {
        try { localStorage.setItem(CUSTOM_LEVEL_KEY, JSON.stringify(next[0].data)); } catch(e){}
      }
      refreshCustomBtn();
      renderCustomLibrary();
      toast('已删除');
    });

    ops.append(bPlay, bEdit, bDel);
    row.append(left, ops);
    box.appendChild(row);
  });
}

function enterLevel(levelId, customId = null){
  if (levelId === 'custom') {
    const data = loadCustomData(customId);
    if (!data || !data.objects || !data.objects.length) { toast('暂无自定义关卡，请先在编辑器创建'); return; }
    state.customData = data;
  }
  buildLevel(levelId);
}

function updateHUD(){
  elRemain.textContent = state.remain;
  if (elRemainTotal) elRemainTotal.textContent = state.totalScrews;
  const totalDemand = state.demandQueue.length;
  const doneDemand = state.demandQueue.filter(d=>d.done).length;
  elProgress.textContent = `${doneDemand}/${totalDemand}`;
}

function makeDemandSlotNode(slot, slotIndex, extraClass = '', forcedFilled = null){
  const div = document.createElement('div');
  if (!slot) {
    div.className = 'demand-slot empty' + extraClass;
    return div;
  }
  div.className = 'demand-slot' + (slotIndex===0 ? ' active' : '') + extraClass;
  div.style.setProperty('--slot-c', slot.color.css);
  const fillCount = forcedFilled == null ? slot.filled : forcedFilled;
  const holes = [0,1,2].map(k => {
    const filled = k < fillCount;
    return `<div class="hole ${filled ? 'progress-filled' : ''}" ${filled ? `style="--slot-c:${slot.color.css}"` : ''}></div>`;
  }).join('');
  div.innerHTML = `<div class="target-screw"></div><div class="holes">${holes}</div>`;
  return div;
}

function renderDemand(){
  elDemandZone.innerHTML = '';
  const now = performance.now();
  state.demandSlots.forEach((slot, slotIndex) => {
    const fx = state.demandSlotFX[slotIndex];
    if (fx) {
      if (now < fx.holdUntil) {
        elDemandZone.appendChild(makeDemandSlotNode(fx.oldView, slotIndex, ' fx-complete', 3));
        return;
      }
      if (now < fx.enterUntil) {
        elDemandZone.appendChild(makeDemandSlotNode(slot, slotIndex, ' fx-enter'));
        return;
      }
      delete state.demandSlotFX[slotIndex];
    }
    elDemandZone.appendChild(makeDemandSlotNode(slot, slotIndex));
  });
}
function renderSpare(){
  elSpareRow.innerHTML = '';
  for (let i=0;i<SPARE_MAX;i++){
    const cell = document.createElement('div');
    cell.className = 'spare-cell';
    const c = state.spares[i];
    if (c) { cell.classList.add('filled'); cell.style.setProperty('--slot-c', c.css); }
    elSpareRow.appendChild(cell);
  }
}

let toastTimer = null;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1200); }
function showOverlay(win){ document.getElementById('ov-emoji').textContent = win ? '🎉' : '💥'; document.getElementById('ov-title').textContent = win ? '胜利！' : '失败'; document.getElementById('ov-desc').textContent = win ? '所有螺丝已成功取出，干得漂亮！' : '备用槽已满，没有空间放置螺丝了。再试一次吧！'; overlay.style.display = 'flex'; }
function hideOverlay(){ overlay.style.display = 'none'; }
document.getElementById('ov-btn').addEventListener('click', () => {
  if (state.currentLevel) enterLevel(state.currentLevel);
});

elExitLevel.addEventListener('click', () => showLevelSelect());
document.querySelectorAll('.level-btn[data-level]').forEach(btn => {
  btn.addEventListener('click', () => {
    const raw = btn.dataset.level || '1';
    const levelId = raw === 'custom' ? 'custom' : Number(raw);
    enterLevel(levelId);
  });
});
document.getElementById('btn-open-editor').addEventListener('click', () => { location.href = 'editor.html'; });
document.getElementById('btn-open-sculpt').addEventListener('click', () => { location.href = 'sculpt.html'; });

// 进入关卡选择时，若存在自定义关卡数据则显示试玩按钮 + 刷新关卡库列表
function refreshCustomBtn(){
  const data = loadCustomData();
  const btn = document.getElementById('btn-play-custom');
  if (btn) {
    const has = !!(data && data.objects && data.objects.length);
    btn.style.display = has ? 'block' : 'none';
    if (has) {
      const latest = loadCustomLevels().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
      btn.textContent = latest ? `▶ 试玩最新：${latest.name || '我的自定义关卡'}` : '▶ 试玩我的自定义关卡';
    }
  }
  renderCustomLibrary();
}

const drag = { active:false, moved:false, lastX:0, lastY:0, startX:0, startY:0 };
const DRAG_THRESHOLD = 6;
function getXY(ev){ if (ev.touches && ev.touches.length) return { x: ev.touches[0].clientX, y: ev.touches[0].clientY }; if (ev.changedTouches && ev.changedTouches.length) return { x: ev.changedTouches[0].clientX, y: ev.changedTouches[0].clientY }; return { x: ev.clientX, y: ev.clientY }; }
function onDown(ev){ if (ev.button !== undefined && ev.button !== 0) return; const { x, y } = getXY(ev); drag.active = true; drag.moved = false; drag.startX = drag.lastX = x; drag.startY = drag.lastY = y; }
function onMove(ev){ if (!drag.active) return; const { x, y } = getXY(ev); const dx = x - drag.lastX, dy = y - drag.lastY; if (!drag.moved && Math.hypot(x - drag.startX, y - drag.startY) > DRAG_THRESHOLD) drag.moved = true; if (drag.moved) { orbit.theta -= dx * 0.008; orbit.phi -= dy * 0.008; orbit.phi = Math.max(orbit.minPhi, Math.min(orbit.maxPhi, orbit.phi)); updateCamera(); updateLightAzimuth(); if (ev.cancelable) ev.preventDefault(); } drag.lastX = x; drag.lastY = y; }
function onUp(ev){ if (!drag.active) return; drag.active = false; if (!drag.moved) { const { x, y } = getXY(ev); tryPickAt(x, y); } }

renderer.domElement.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
renderer.domElement.addEventListener('touchstart', onDown, { passive:true });
window.addEventListener('touchmove', onMove, { passive:false });
window.addEventListener('touchend', onUp);
// 滚轮缩放：deltaY>0（向下滚）拉远、deltaY<0（向上滚）拉近，步长 0.03 让缩放更跟手。
// 结果钳制在 [zoomMin, zoomMax]（随人头缩放联动），避免穿模或被雾吞没。
renderer.domElement.addEventListener('wheel', (ev) => { ev.preventDefault(); orbit.radius += ev.deltaY * 0.03; orbit.radius = Math.max(orbit.zoomMin, Math.min(orbit.zoomMax, orbit.radius)); updateCamera(); }, { passive:false });
window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

function animate(){
  requestAnimationFrame(animate);
  // 人形模特按缩放渐隐（拉近越透明，拉远越清晰，平滑过渡）
  if (mannequin && mannequin.visible) {
    const mat = mannequin.userData.material;
    const target = mannequinTargetOpacity();
    mat.opacity += (target - mat.opacity) * 0.11;   // 渐隐响应放慢 50%
    // 接近全不透明时走「实体渲染通道」(transparent=false)，避免透明通道在不同
    // 视角下的前后排序/剔除假象导致整体突然消失；只有真正半透明(拉近)才切透明通道。
    const wantTransparent = mat.opacity < 0.985;
    if (mat.transparent !== wantTransparent) { mat.transparent = wantTransparent; mat.needsUpdate = true; }
    // 一体化：始终写深度。半透明时也只显示最前表面，整体呈一个统一的半透明剪影，
    // 而不是看穿内部颈/胸/头各网格、出现「分开」的层叠重影。
    mat.depthWrite = true;
  }
  renderer.render(scene, camera);
}

// 从编辑器「试玩」跳转进来：?custom=1 直接进入自定义关卡
const urlParams = new URLSearchParams(location.search);
// 用 try/catch 包裹入口：任何关卡构建异常都不应阻断后续的 animate()，否则渲染循环
// 永不启动 → 整页白屏。出错时回退到关卡选择，保证界面始终可见、可交互。
try {
  if (urlParams.get('custom') === '1' && loadCustomData()) {
    enterLevel('custom');
  } else {
    showLevelSelect();
  }
} catch (err) {
  console.error('进入关卡失败：', err);
  try { showLevelSelect(); } catch (_) {}
  try { alert('关卡加载失败，已返回关卡选择。\n' + (err && err.message ? err.message : err)); } catch (_) {}
}
animate();
</script>
